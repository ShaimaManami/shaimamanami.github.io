  <body data-theme="dark">
    <!-- <div
      class="progress-bar"
      data-status="idle"
      data-visible="false"
      data-complete="true"
    ></div> -->
    <a
      class="visually-hidden page__skip-link"
      data-hidden="false"
      data-show-on-focus="true"
      href="#main-content"
      >Skip to main content</a
    >
    <header class="navbar" id="navbar-root"></header>
    <main id="main-content" class="page" tabindex="-1" data-loading="false">
      <div class="section contact-page">
        <form class="contact-page__form">
          <h1
            class="heading contact-page__title"
            data-align="auto"
            data-weight="medium"
            data-level="3"
            data-status="entered"
            style="--delay: 360ms"
          >
            <span class="decoder-text"
              ><span class="visually-hidden" data-hidden="true">Say hello</span
              ><span aria-hidden="true"
                ><span class="decoder-text__value">S</span
                ><span class="decoder-text__value">a</span
                ><span class="decoder-text__value">y</span
                ><span class="decoder-text__value"> </span
                ><span class="decoder-text__value">h</span
                ><span class="decoder-text__value">e</span
                ><span class="decoder-text__value">l</span
                ><span class="decoder-text__value">l</span
                ><span class="decoder-text__value">o</span></span
              ></span
            >
          </h1>
          <div
            class="divider contact-page__divider"
            style="
              --lineWidth: 100%;
              --lineHeight: 2px;
              --notchWidth: 90px;
              --notchHeight: 10px;
              --collapseDelay: 0ms;
              --delay: 380ms;
            "
            data-status="entered"
          >
            <div class="divider__line" data-collapsed="false"></div>
            <div
              class="divider__notch"
              data-collapsed="false"
              style="--collapseDelay: 160ms"
            ></div>
          </div>
          <div class="field contact-page__honeypot" data-error="false">
            <div class="field__content">
              <label
                class="field__label"
                data-focused="false"
                data-filled="false"
                id=":R1uoml:input-label"
                for=":R1uoml:input"
                >Name</label
              ><input
                class="field__input"
                id=":R1uoml:input"
                aria-labelledby=":R1uoml:input-label"
                maxlength="512"
                name="name"
                value=""
              />
              <div class="field__underline" data-focused="false"></div>
            </div>
          </div>
          <div
            class="field contact-page__field"
            data-error="false"
            style="--delay: 500ms"
            data-status="entered"
          >
            <div class="field__content">
              <label
                class="field__label"
                data-focused="false"
                data-filled="false"
                id=":R2eoml:input-label"
                for=":R2eoml:input"
                >Your email</label
              ><input
                class="field__input"
                id=":R2eoml:input"
                aria-labelledby=":R2eoml:input-label"
                autocomplete="email"
                required=""
                maxlength="512"
                type="email"
                name="email"
                value=""
              />
              <div class="field__underline" data-focused="false"></div>
            </div>
          </div>
          <div
            class="field contact-page__field"
            data-error="false"
            style="--delay: 600ms"
            data-status="entered"
          >
            <div class="field__content">
              <label
                class="field__label"
                data-focused="false"
                data-filled="false"
                id=":R2uoml:input-label"
                for=":R2uoml:input"
                >Message</label
              ><textarea
                class="textarea field__input"
                style="--resize: none"
                rows="1"
                id=":R2uoml:input"
                aria-labelledby=":R2uoml:input-label"
                autocomplete="off"
                required=""
                maxlength="4096"
                name="message"
              ></textarea>
              <div class="field__underline" data-focused="false"></div>
            </div>
          </div>
          <button
            class="button contact-page__submit-button"
            data-loading="false"
            data-icon="send"
            data-status="entered"
            data-sending="false"
            style="--delay: 700ms"
            type="submit"
          >
            <svg
              aria-hidden="true"
              class="icon button__icon"
              width="24"
              height="24"
              data-start="true">
              <use href="/assets/images/icons-placeholder.svg#send"></use></svg><span class="button__text">Send message</span>
          </button>
        </form>
        <footer class="footer contact-page__footer">
          <span
            class="text"
            data-align="center"
            data-size="s"
            data-weight="auto"
            ><span class="footer__date">© 2026 Shaima Alsharif</span></span
          >
        </footer>
      </div>
    </main>
    <script type="module" src="/assets/js/vanilla-core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="/assets/js/contact-form.js" defer></script>
  </body>
